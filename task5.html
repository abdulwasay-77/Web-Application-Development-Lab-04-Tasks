<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Task 5 - Campus Photos</title>
<link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-4">

<h2 class="text-center mb-4">Campus Photos</h2>


<div class="row g-3">

  <div class="col-6 col-md-4">
    <img src="images/gate.png" class="img-fluid rounded shadow-sm" alt="Main gate">
    <p class="text-center small mt-1">Main gate</p>
  </div>

  <div class="col-6 col-md-4">
    <img src="images/hills.png" class="img-fluid rounded shadow-sm" alt="Margalla hills">
    <p class="text-center small mt-1">Margalla hills</p>
  </div>

  <div class="col-6 col-md-4">
    <img src="images/science.png" class="img-fluid rounded shadow-sm" alt="Science block">
    <p class="text-center small mt-1">Science block</p>
  </div>

  <div class="col-6 col-md-4">
    <img src="images/trophy.png" class="img-fluid rounded shadow-sm" alt="Robotics trophy">
    <p class="text-center small mt-1">Robotics trophy</p>
  </div>

  <div class="col-6 col-md-4">
    <img src="images/lake.png" class="img-fluid rounded shadow-sm" alt="Lake">
    <p class="text-center small mt-1">Lake at sunset</p>
  </div>

  <div class="col-6 col-md-4">
    <img src="images/hall.png" class="img-fluid rounded shadow-sm" alt="Convocation hall">
    <p class="text-center small mt-1">Convocation hall</p>
  </div>

</div>

<h2 class="mt-5 mb-3">Photo Team</h2>

<div class="row g-3 mb-4">

  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center gap-3">
      <img src="images/ali.png" class="rounded-circle" width="90" alt="ali">
      <div>
        <h4>Ali</h4>
        <p class="text-body-secondary mb-0">Team lead, took most of the campus photos</p>
      </div>
    </div>
  </div>


  <div class="col-12 col-md-6">
    <div class="d-flex align-items-center gap-3">
      <img src="images/1.png" class="img-thumbnail" width="90" alt="1">
      <div>
        <h4>wasay</h4>
        <p class="text-body-secondary mb-0">Edited the pictures for the website</p>
      </div>
    </div>
  </div>

</div>

</div>

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>
</body>
</html>
